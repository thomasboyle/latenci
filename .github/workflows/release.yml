name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build installer
        run: cmake --build build --target installer

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path installer/RoutingCrumbs.iss -Pattern '#define MyAppVersion "(.*)"').Matches[0].Groups[1].Value
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-build.${{ github.run_number }}
          name: Routing Crumbs v${{ steps.version.outputs.version }} (build ${{ github.run_number }})
          files: |
            dist/RoutingCrumbs-Setup-${{ steps.version.outputs.version }}.exe
            build/RoutingCrumbs.exe
          generate_release_notes: true
