name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        shell: pwsh
        run: |
          git fetch --tags --force
          $parsed = git tag -l 'v*' | ForEach-Object {
            $t = $_ -replace '^v', ''
            if ($t -match '^(\d+\.\d+\.\d+)(?:-build\.\d+)?$') { $Matches[1] }
          } | Where-Object { $_ }
          if ($parsed) {
            $latest = $parsed | Sort-Object { [version]$_ } | Select-Object -Last 1
            $parts = $latest.Split('.')
            $next = '{0}.{1}.{2}' -f $parts[0], $parts[1], ([int]$parts[2] + 1)
          } else {
            $next = (Select-String -Path installer/ci-version.iss -Pattern '#define MyAppVersion "(.*)"').Matches[0].Groups[1].Value
          }
          "version=$next" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Set installer version
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          "#define MyAppVersion `"$version`"" | Set-Content installer/ci-version.iss -Encoding utf8NoBOM
          @(
            '#pragma once'
            ''
            '// Bumped by CI on release; keep in sync with installer/ci-version.iss locally.'
            '#ifndef APP_VERSION'
            "#define APP_VERSION `"$version`""
            '#endif'
          ) | Set-Content src/Version.h -Encoding utf8NoBOM

      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build installer
        run: cmake --build build --target installer

      - name: Verify release artifacts
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $installer = "dist/Latenci-Setup-$version.exe"
          $binary = "build/Latenci.exe"
          if (-not (Test-Path $installer)) {
            Write-Error "Installer not found: $installer"
            Get-ChildItem dist -ErrorAction SilentlyContinue
            exit 1
          }
          if (-not (Test-Path $binary)) {
            Write-Error "Binary not found: $binary"
            exit 1
          }

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Latenci v${{ steps.version.outputs.version }}
          files: |
            dist/Latenci-Setup-${{ steps.version.outputs.version }}.exe
            build/Latenci.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
